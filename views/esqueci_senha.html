<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Gerenciador de OS STAMPEX</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .reset-box {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 360px;
            margin: auto;
            box-sizing: border-box;
        }
        .reset-box h2 {
            margin-bottom: 12px;
            color: #333;
            text-align: center;
        }
        .info-tip {
            background-color: #e8f4fd;
            border-left: 4px solid #007bff;
            padding: 10px 12px;
            font-size: 13px;
            color: #333;
            margin-bottom: 15px;
            border-radius: 0 4px 4px 0;
            line-height: 1.4;
        }
        .message-alert {
            display: none;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }
        .message-alert.error {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .message-alert.success {
            display: block;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="reset-box">
        <h2>Recuperar Senha</h2>

        <div class="info-tip">
            Para redefinir sua senha, informe seu usuário, a <strong>Chave de Segurança do Administrador</strong> e a sua nova senha.
        </div>

        <div id="messageAlert" class="message-alert"></div>

        <form id="resetPasswordForm">
            <div class="input-group">
                <label for="username">Usuário:</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="input-group">
                <label for="securityKey">Chave de Segurança (Admin):</label>
                <input type="password" id="securityKey" name="securityKey" placeholder="Chave fornecida pelo admin" required>
            </div>
            <div class="input-group">
                <label for="newPassword">Nova Senha:</label>
                <input type="password" id="newPassword" name="newPassword" required autocomplete="new-password">
            </div>
            <div class="input-group">
                <label for="confirmPassword">Confirmar Nova Senha:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
            </div>
            <button type="submit" id="submitBtn">Redefinir Senha</button>
        </form>

        <a href="index.html" class="back-to-menu-btn" style="margin-top: 15px;">Voltar ao Login</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('resetPasswordForm');
            const messageAlert = document.getElementById('messageAlert');
            const submitBtn = document.getElementById('submitBtn');

            function showMessage(text, isError = false) {
                messageAlert.textContent = text;
                messageAlert.className = 'message-alert ' + (isError ? 'error' : 'success');
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                messageAlert.style.display = 'none';

                const username = document.getElementById('username').value.trim();
                const securityKey = document.getElementById('securityKey').value.trim();
                const newPassword = document.getElementById('newPassword').value.trim();
                const confirmPassword = document.getElementById('confirmPassword').value.trim();

                if (!username || !securityKey || !newPassword || !confirmPassword) {
                    showMessage('Preencha todos os campos.', true);
                    return;
                }

                if (newPassword.length < 3) {
                    showMessage('A nova senha deve ter no mínimo 3 caracteres.', true);
                    return;
                }

                if (newPassword !== confirmPassword) {
                    showMessage('A nova senha e a confirmação não coincidem.', true);
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Redefinindo...';

                try {
                    const response = await fetch('/api/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username,
                            securityKey,
                            newPassword
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showMessage(data.message || 'Senha redefinida com sucesso!', false);
                        form.reset();
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 2000);
                    } else {
                        showMessage(data.message || 'Erro ao redefinir senha.', true);
                    }
                } catch (err) {
                    console.error('Erro na requisição:', err);
                    showMessage('Erro de comunicação com o servidor. Tente novamente.', true);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Redefinir Senha';
                }
            });
        });
    </script>
</body>
</html>
