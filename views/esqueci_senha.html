<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Gerenciador de OS STAMPEX</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="stampex-theme">
    <div class="reset-box">
        <h2>Recuperar Senha</h2>
        <a href="index.html" class="back-to-menu-btn">Voltar ao Login</a>

        <div class="info-tip">
            Para redefinir sua senha, informe seu usuário, a <strong>Chave de Segurança do Administrador</strong> e a sua nova senha.
        </div>

        <div id="messageAlert" class="message-alert"></div>

        <form id="resetPasswordForm">
            <div class="input-group">
                <label for="username">Usuário:</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="input-group">
                <label for="securityKey">Chave de Segurança (Admin):</label>
                <input type="password" id="securityKey" name="securityKey" placeholder="Chave fornecida pelo admin" required>
            </div>
            <div class="input-group">
                <label for="newPassword">Nova Senha:</label>
                <input type="password" id="newPassword" name="newPassword" required autocomplete="new-password">
            </div>
            <div class="input-group">
                <label for="confirmPassword">Confirmar Nova Senha:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
            </div>
            <button type="submit" id="submitBtn">Redefinir Senha</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('resetPasswordForm');
            const messageAlert = document.getElementById('messageAlert');
            const submitBtn = document.getElementById('submitBtn');

            function showMessage(text, isError = false) {
                messageAlert.textContent = text;
                messageAlert.className = 'message-alert ' + (isError ? 'error' : 'success');
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                messageAlert.style.display = 'none';

                const username = document.getElementById('username').value.trim();
                const securityKey = document.getElementById('securityKey').value.trim();
                const newPassword = document.getElementById('newPassword').value.trim();
                const confirmPassword = document.getElementById('confirmPassword').value.trim();

                if (!username || !securityKey || !newPassword || !confirmPassword) {
                    showMessage('Preencha todos os campos.', true);
                    return;
                }

                if (newPassword.length < 3) {
                    showMessage('A nova senha deve ter no mínimo 3 caracteres.', true);
                    return;
                }

                if (newPassword !== confirmPassword) {
                    showMessage('A nova senha e a confirmação não coincidem.', true);
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Redefinindo...';

                try {
                    const response = await fetch('/api/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username,
                            securityKey,
                            newPassword
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showMessage(data.message || 'Senha redefinida com sucesso!', false);
                        form.reset();
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 2000);
                    } else {
                        showMessage(data.message || 'Erro ao redefinir senha.', true);
                    }
                } catch (err) {
                    console.error('Erro na requisição:', err);
                    showMessage('Erro de comunicação com o servidor. Tente novamente.', true);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Redefinir Senha';
                }
            });
        });
    </script>
</body>
</html>
