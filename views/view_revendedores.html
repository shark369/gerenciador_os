<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Revendedores - Gerenciador de OS STAMPEX</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="stampex-theme">
    <div class="container">
        <h2>Revendedores</h2>
        <a href="revendedor_menu.html" class="back-to-menu-btn">Voltar ao Menu do Revendedor</a>
        <div class="search-section">
            <input type="text" id="revendedorSearch" placeholder="Pesquisar revendedor por nome, telefone ou cidade...">
        </div>
        <table id="revendedoresTable">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Celular</th>
                    <th>Cidade</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Linhas da tabela serão inseridas aqui via JavaScript -->
            </tbody>
        </table>
    </div>
    <script src="js/view_revendedores_script.js"></script>
</body>
</html>
